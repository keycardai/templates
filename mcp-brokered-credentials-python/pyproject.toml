[project]
name = "mcp-brokered-credentials-python"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "keycardai-mcp>=2.3.12,<3",
    "keycardai-oauth>=0.47.0",
    "keycardai-starlette>=0.18.0",
    "httpx>=0.27.0",
    "uvicorn>=0.54.0",
    "starlette>=1.7.0",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
