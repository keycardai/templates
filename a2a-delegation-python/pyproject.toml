[project]
name = "a2a-delegation-python"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "keycardai-a2a>=0.5.0",
    "a2a-sdk[http-server]>=1.2.0",
    "uvicorn>=0.32.0",
    "starlette>=0.27.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
