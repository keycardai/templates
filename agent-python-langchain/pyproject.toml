[project]
name = "agent-python-langchain"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "keycardai-langchain>=0.7.5",
    "keycardai-oauth>=0.47.0",
    "anthropic>=1.2.0",
    "langchain>=1.5.2",
    "langchain-anthropic>=1.7.13",
    "langgraph>=1.0",
    "langgraph-cli[inmem]>=0.4.44",
    "httpx>=0.27.0",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["calendar_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
