[project]
name = "agent-python-langchain"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "keycardai-langchain>=0.4.0",
    "anthropic>=1.2.0",
    "langchain>=1.0",
    "langchain-anthropic>=1.6",
    "langgraph>=1.0",
    "langgraph-cli[inmem]>=0.4",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["calendar_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
