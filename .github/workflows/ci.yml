name: Template CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      template:
        description: "Template to verify (leave blank for all)"
        required: false
  workflow_call:
    inputs:
      templates:
        description: "JSON array of template directory names to verify"
        required: true
        type: string
      ref:
        description: "Commit SHA to check out"
        required: true
        type: string

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      typescript: ${{ steps.find.outputs.typescript }}
      python: ${{ steps.find.outputs.python }}
      go: ${{ steps.find.outputs.go }}
      ruby: ${{ steps.find.outputs.ruby }}
      java: ${{ steps.find.outputs.java }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - id: find
        env:
          TEMPLATE: ${{ inputs.template }}
          TEMPLATES: ${{ inputs.templates }}
          EVENT_NAME: ${{ github.event_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Emit a JSON array for every language so matrix jobs never read an
          # empty output.
          emit_lists() {
            local ts=() py=() go=() rb=() java=()
            local dir
            for dir in "$@"; do
              if [ -f "$dir/package.json" ]; then
                ts+=("$dir")
              elif [ -f "$dir/go.mod" ]; then
                go+=("$dir")
              elif [ -f "$dir/Gemfile" ]; then
                rb+=("$dir")
              elif [ -f "$dir/build.gradle.kts" ]; then
                java+=("$dir")
              elif [ -f "$dir/pyproject.toml" ]; then
                py+=("$dir")
              else
                echo "::error::Cannot detect the language of '$dir': no package.json, go.mod, Gemfile, build.gradle.kts or pyproject.toml"
                exit 1
              fi
            done

            to_json() {
              if [ "$#" -eq 0 ]; then
                echo "[]"
              else
                printf '%s\n' "$@" | sort -u | jq -R . | jq -sc .
              fi
            }

            {
              echo "typescript=$(to_json "${ts[@]}")"
              echo "python=$(to_json "${py[@]}")"
              echo "go=$(to_json "${go[@]}")"
              echo "ruby=$(to_json "${rb[@]}")"
              echo "java=$(to_json "${java[@]}")"
            } >> "$GITHUB_OUTPUT"
          }

          discover() {
            # $1 is the marker file that identifies the language.
            find . -maxdepth 1 -mindepth 1 -type d ! -name '.*' ! -name '_*' ! -name 'scripts' ! -name 'eval' \
              -exec test -f "{}/$1" \; -print \
              | sed 's|^\./||' | sort | jq -R . | jq -sc .
          }

          is_real_template() {
            local dir="$1"
            case "$dir" in
              ""|.*|_*|scripts|eval) return 1 ;;
            esac
            [ -d "$dir" ] || return 1
            [ -f "$dir/package.json" ] || [ -f "$dir/go.mod" ] || [ -f "$dir/Gemfile" ] || [ -f "$dir/build.gradle.kts" ] || [ -f "$dir/pyproject.toml" ]
          }

          if [ -n "$TEMPLATES" ]; then
            mapfile -t selected < <(jq -er 'if type == "array" then .[] else error("templates must be a JSON array") end' <<< "$TEMPLATES")
            emit_lists "${selected[@]}"
          elif [ -n "$TEMPLATE" ]; then
            emit_lists "$TEMPLATE"
          elif [ "$EVENT_NAME" = "pull_request" ] && [ "$PR_AUTHOR" = "dependabot[bot]" ]; then
            touched=()
            while IFS= read -r dir; do
              if is_real_template "$dir"; then
                touched+=("$dir")
              fi
            done < <(git diff --name-only "${PR_BASE_SHA}...${PR_HEAD_SHA}" | awk -F/ 'NF > 1 { print $1 }' | sort -u)
            emit_lists "${touched[@]}"
          else
            {
              echo "typescript=$(discover package.json)"
              echo "go=$(discover go.mod)"
              echo "ruby=$(discover Gemfile)"
              echo "java=$(discover build.gradle.kts)"
              echo "python=$(find . -maxdepth 1 -mindepth 1 -type d ! -name '.*' ! -name '_*' ! -name 'scripts' ! -name 'eval' \
                -exec test -f '{}/pyproject.toml' \; \
                ! -exec test -f '{}/package.json' \; -print \
                | sed 's|^\./||' | sort | jq -R . | jq -sc .)"
            } >> "$GITHUB_OUTPUT"
          fi
      - name: Fetch Dependabot metadata
        id: dependabot_metadata
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
        continue-on-error: true
        uses: dependabot/fetch-metadata@21025c705c08248db411dc16f3619e6b5f9ea21a # v2
        with:
          github-token: ${{ github.token }}
      - name: Write Dependabot metadata artifact
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' && steps.dependabot_metadata.outcome == 'success'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DEPENDENCY_NAMES: ${{ steps.dependabot_metadata.outputs.dependency-names }}
          UPDATE_TYPE: ${{ steps.dependabot_metadata.outputs.update-type }}
          DEPENDENCY_GROUP: ${{ steps.dependabot_metadata.outputs.dependency-group }}
          PACKAGE_ECOSYSTEM: ${{ steps.dependabot_metadata.outputs.package-ecosystem }}
        run: |
          jq -n \
            --arg head_sha "$HEAD_SHA" \
            --arg dependency_names "$DEPENDENCY_NAMES" \
            --arg update_type "$UPDATE_TYPE" \
            --arg dependency_group "$DEPENDENCY_GROUP" \
            --arg package_ecosystem "$PACKAGE_ECOSYSTEM" \
            '{
              head_sha: $head_sha,
              dependency_names: $dependency_names,
              update_type: $update_type,
              dependency_group: $dependency_group,
              package_ecosystem: $package_ecosystem
            }' > "${RUNNER_TEMP}/dependabot-metadata.json"
      - name: Upload Dependabot metadata artifact
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' && steps.dependabot_metadata.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: dependabot-metadata
          path: ${{ runner.temp }}/dependabot-metadata.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  verify-typescript:
    needs: discover
    if: needs.discover.outputs.typescript != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template: ${{ fromJson(needs.discover.outputs.typescript) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.template == 'delegated-access-typescript-cloudflare' && '22' || '20' }}
          cache: "npm"
          cache-dependency-path: "${{ matrix.template }}/package*.json"

      - name: Install
        working-directory: ${{ matrix.template }}
        run: npm install

      - name: Build
        working-directory: ${{ matrix.template }}
        run: npm run build

      - name: Live-zone checks skipped on Dependabot PRs
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        run: >
          echo "::notice::Live-zone checks skipped: Dependabot runs get no Actions secrets.
          The Dependency Bump workflow runs live-zone verify and eval after Template CI completes."

      - name: Create ephemeral zone
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        id: zone
        env:
          CI_KEYCARD_CLIENT_ID: ${{ secrets.CI_KEYCARD_CLIENT_ID }}
          CI_KEYCARD_CLIENT_SECRET: ${{ secrets.CI_KEYCARD_CLIENT_SECRET }}
          CI_KEYCARD_ENDPOINT: ${{ secrets.CI_KEYCARD_ENDPOINT }}
        run: |
          ZONE_NAME="templates-ci-${{ github.run_id }}-${{ strategy.job-index }}"
          TOKEN=$(curl -sf -X POST "${CI_KEYCARD_ENDPOINT}/service-account-token" \
            -d "grant_type=client_credentials" \
            -d "client_id=${CI_KEYCARD_CLIENT_ID}" \
            -d "client_secret=${CI_KEYCARD_CLIENT_SECRET}" \
            | jq -r '.access_token')
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then echo "Failed to obtain access token"; exit 1; fi
          echo "::add-mask::$TOKEN"
          echo "TOKEN=$TOKEN" >> "$GITHUB_ENV"
          sleep 5
          ZONE=$(curl -sf -X POST "${CI_KEYCARD_ENDPOINT}/zones" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"name\": \"${ZONE_NAME}\"}")
          echo "ZONE_ID=$(echo "$ZONE" | jq -r '.id')" >> "$GITHUB_OUTPUT"
          echo "KEYCARD_URL=$(echo "$ZONE" | jq -r '.protocols.oauth2.issuer')" >> "$GITHUB_OUTPUT"

      - name: Start server and verify
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        working-directory: ${{ matrix.template }}
        env:
          PORT: "8000"
          KEYCARD_URL: ${{ steps.zone.outputs.KEYCARD_URL }}
          KEYCARD_CLIENT_ID: ${{ secrets.CI_KEYCARD_CLIENT_ID }}
          KEYCARD_CLIENT_SECRET: ${{ secrets.CI_KEYCARD_CLIENT_SECRET }}
        run: npm run ci:verify

      - name: Delete ephemeral zone
        if: always() && github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          CI_KEYCARD_ENDPOINT: ${{ secrets.CI_KEYCARD_ENDPOINT }}
        run: |
          [ -n "${{ steps.zone.outputs.ZONE_ID }}" ] && \
            curl -sf -X DELETE "${CI_KEYCARD_ENDPOINT}/zones/${{ steps.zone.outputs.ZONE_ID }}" \
              -H "Authorization: Bearer $TOKEN" && echo "Zone deleted" || true

  verify-python:
    needs: discover
    if: needs.discover.outputs.python != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template: ${{ fromJson(needs.discover.outputs.python) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        working-directory: ${{ matrix.template }}
        run: uv sync

      - name: Live-zone checks skipped on Dependabot PRs
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        run: >
          echo "::notice::Live-zone checks skipped: Dependabot runs get no Actions secrets.
          The Dependency Bump workflow runs live-zone verify and eval after Template CI completes."

      - name: Create ephemeral zone
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        id: zone
        env:
          CI_KEYCARD_CLIENT_ID: ${{ secrets.CI_KEYCARD_CLIENT_ID }}
          CI_KEYCARD_CLIENT_SECRET: ${{ secrets.CI_KEYCARD_CLIENT_SECRET }}
          CI_KEYCARD_ENDPOINT: ${{ secrets.CI_KEYCARD_ENDPOINT }}
        run: |
          ZONE_NAME="templates-ci-${{ github.run_id }}-${{ strategy.job-index }}"
          TOKEN=$(curl -sf -X POST "${CI_KEYCARD_ENDPOINT}/service-account-token" \
            -d "grant_type=client_credentials" \
            -d "client_id=${CI_KEYCARD_CLIENT_ID}" \
            -d "client_secret=${CI_KEYCARD_CLIENT_SECRET}" \
            | jq -r '.access_token')
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then echo "Failed to obtain access token"; exit 1; fi
          echo "::add-mask::$TOKEN"
          echo "TOKEN=$TOKEN" >> "$GITHUB_ENV"
          sleep 5
          ZONE=$(curl -sf -X POST "${CI_KEYCARD_ENDPOINT}/zones" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"name\": \"${ZONE_NAME}\"}")
          echo "ZONE_ID=$(echo "$ZONE" | jq -r '.id')" >> "$GITHUB_OUTPUT"
          echo "KEYCARD_URL=$(echo "$ZONE" | jq -r '.protocols.oauth2.issuer')" >> "$GITHUB_OUTPUT"

      - name: Start server and verify
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        working-directory: ${{ matrix.template }}
        env:
          PORT: "8000"
          KEYCARD_URL: ${{ steps.zone.outputs.KEYCARD_URL }}
          KEYCARD_CLIENT_ID: ${{ secrets.CI_KEYCARD_CLIENT_ID }}
          KEYCARD_CLIENT_SECRET: ${{ secrets.CI_KEYCARD_CLIENT_SECRET }}
        run: bash scripts/ci-verify.sh

      - name: Delete ephemeral zone
        if: always() && github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          CI_KEYCARD_ENDPOINT: ${{ secrets.CI_KEYCARD_ENDPOINT }}
        run: |
          [ -n "${{ steps.zone.outputs.ZONE_ID }}" ] && \
            curl -sf -X DELETE "${CI_KEYCARD_ENDPOINT}/zones/${{ steps.zone.outputs.ZONE_ID }}" \
              -H "Authorization: Bearer $TOKEN" && echo "Zone deleted" || true

  verify-go:
    needs: discover
    if: needs.discover.outputs.go != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template: ${{ fromJson(needs.discover.outputs.go) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: "${{ matrix.template }}/go.sum"

      - name: Build
        working-directory: ${{ matrix.template }}
        run: go build ./...

      - name: Live-zone checks skipped on Dependabot PRs
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        run: >
          echo "::notice::Live-zone checks skipped: Dependabot runs get no Actions secrets.
          The Dependency Bump workflow runs live-zone verify and eval after Template CI completes."

      - name: Create ephemeral zone
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        id: zone
        env:
          CI_KEYCARD_CLIENT_ID: ${{ secrets.CI_KEYCARD_CLIENT_ID }}
          CI_KEYCARD_CLIENT_SECRET: ${{ secrets.CI_KEYCARD_CLIENT_SECRET }}
          CI_KEYCARD_ENDPOINT: ${{ secrets.CI_KEYCARD_ENDPOINT }}
        run: |
          ZONE_NAME="templates-ci-${{ github.run_id }}-${{ strategy.job-index }}"
          TOKEN=$(curl -sf -X POST "${CI_KEYCARD_ENDPOINT}/service-account-token" \
            -d "grant_type=client_credentials" \
            -d "client_id=${CI_KEYCARD_CLIENT_ID}" \
            -d "client_secret=${CI_KEYCARD_CLIENT_SECRET}" \
            | jq -r '.access_token')
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then echo "Failed to obtain access token"; exit 1; fi
          echo "::add-mask::$TOKEN"
          echo "TOKEN=$TOKEN" >> "$GITHUB_ENV"
          sleep 5
          ZONE=$(curl -sf -X POST "${CI_KEYCARD_ENDPOINT}/zones" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"name\": \"${ZONE_NAME}\"}")
          echo "ZONE_ID=$(echo "$ZONE" | jq -r '.id')" >> "$GITHUB_OUTPUT"
          echo "KEYCARD_URL=$(echo "$ZONE" | jq -r '.protocols.oauth2.issuer')" >> "$GITHUB_OUTPUT"

      - name: Start server and verify
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        working-directory: ${{ matrix.template }}
        env:
          PORT: "8000"
          KEYCARD_URL: ${{ steps.zone.outputs.KEYCARD_URL }}
          KEYCARD_CLIENT_ID: ${{ secrets.CI_KEYCARD_CLIENT_ID }}
          KEYCARD_CLIENT_SECRET: ${{ secrets.CI_KEYCARD_CLIENT_SECRET }}
        run: bash scripts/ci-verify.sh

      - name: Delete ephemeral zone
        if: always() && github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          CI_KEYCARD_ENDPOINT: ${{ secrets.CI_KEYCARD_ENDPOINT }}
        run: |
          [ -n "${{ steps.zone.outputs.ZONE_ID }}" ] && \
            curl -sf -X DELETE "${CI_KEYCARD_ENDPOINT}/zones/${{ steps.zone.outputs.ZONE_ID }}" \
              -H "Authorization: Bearer $TOKEN" && echo "Zone deleted" || true

  verify-ruby:
    needs: discover
    if: needs.discover.outputs.ruby != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template: ${{ fromJson(needs.discover.outputs.ruby) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          # The templates ship no Gemfile.lock, so resolution happens here
          # against the CI Ruby rather than whichever Ruby wrote a lockfile.
          bundler-cache: true
          working-directory: ${{ matrix.template }}

      - name: Live-zone checks skipped on Dependabot PRs
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        run: >
          echo "::notice::Live-zone checks skipped: Dependabot runs get no Actions secrets.
          The Dependency Bump workflow runs live-zone verify and eval after Template CI completes."

      - name: Create ephemeral zone
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        id: zone
        env:
          CI_KEYCARD_CLIENT_ID: ${{ secrets.CI_KEYCARD_CLIENT_ID }}
          CI_KEYCARD_CLIENT_SECRET: ${{ secrets.CI_KEYCARD_CLIENT_SECRET }}
          CI_KEYCARD_ENDPOINT: ${{ secrets.CI_KEYCARD_ENDPOINT }}
        run: |
          ZONE_NAME="templates-ci-${{ github.run_id }}-${{ strategy.job-index }}"
          TOKEN=$(curl -sf -X POST "${CI_KEYCARD_ENDPOINT}/service-account-token" \
            -d "grant_type=client_credentials" \
            -d "client_id=${CI_KEYCARD_CLIENT_ID}" \
            -d "client_secret=${CI_KEYCARD_CLIENT_SECRET}" \
            | jq -r '.access_token')
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then echo "Failed to obtain access token"; exit 1; fi
          echo "::add-mask::$TOKEN"
          echo "TOKEN=$TOKEN" >> "$GITHUB_ENV"
          sleep 5
          ZONE=$(curl -sf -X POST "${CI_KEYCARD_ENDPOINT}/zones" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"name\": \"${ZONE_NAME}\"}")
          echo "ZONE_ID=$(echo "$ZONE" | jq -r '.id')" >> "$GITHUB_OUTPUT"
          echo "KEYCARD_URL=$(echo "$ZONE" | jq -r '.protocols.oauth2.issuer')" >> "$GITHUB_OUTPUT"

      - name: Start server and verify
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        working-directory: ${{ matrix.template }}
        env:
          PORT: "8000"
          KEYCARD_URL: ${{ steps.zone.outputs.KEYCARD_URL }}
          KEYCARD_CLIENT_ID: ${{ secrets.CI_KEYCARD_CLIENT_ID }}
          KEYCARD_CLIENT_SECRET: ${{ secrets.CI_KEYCARD_CLIENT_SECRET }}
        run: bash scripts/ci-verify.sh

      - name: Delete ephemeral zone
        if: always() && github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          CI_KEYCARD_ENDPOINT: ${{ secrets.CI_KEYCARD_ENDPOINT }}
        run: |
          [ -n "${{ steps.zone.outputs.ZONE_ID }}" ] && \
            curl -sf -X DELETE "${CI_KEYCARD_ENDPOINT}/zones/${{ steps.zone.outputs.ZONE_ID }}" \
              -H "Authorization: Bearer $TOKEN" && echo "Zone deleted" || true

  verify-java:
    needs: discover
    if: needs.discover.outputs.java != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template: ${{ fromJson(needs.discover.outputs.java) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        working-directory: ${{ matrix.template }}
        run: ./gradlew build installDist

      - name: Live-zone checks skipped on Dependabot PRs
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        run: >
          echo "::notice::Live-zone checks skipped: Dependabot runs get no Actions secrets.
          The Dependency Bump workflow runs live-zone verify and eval after Template CI completes."

      - name: Create ephemeral zone
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        id: zone
        env:
          CI_KEYCARD_CLIENT_ID: ${{ secrets.CI_KEYCARD_CLIENT_ID }}
          CI_KEYCARD_CLIENT_SECRET: ${{ secrets.CI_KEYCARD_CLIENT_SECRET }}
          CI_KEYCARD_ENDPOINT: ${{ secrets.CI_KEYCARD_ENDPOINT }}
        run: |
          ZONE_NAME="templates-ci-${{ github.run_id }}-${{ strategy.job-index }}"
          TOKEN=$(curl -sf -X POST "${CI_KEYCARD_ENDPOINT}/service-account-token" \
            -d "grant_type=client_credentials" \
            -d "client_id=${CI_KEYCARD_CLIENT_ID}" \
            -d "client_secret=${CI_KEYCARD_CLIENT_SECRET}" \
            | jq -r '.access_token')
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then echo "Failed to obtain access token"; exit 1; fi
          echo "::add-mask::$TOKEN"
          echo "TOKEN=$TOKEN" >> "$GITHUB_ENV"
          sleep 5
          ZONE=$(curl -sf -X POST "${CI_KEYCARD_ENDPOINT}/zones" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"name\": \"${ZONE_NAME}\"}")
          echo "ZONE_ID=$(echo "$ZONE" | jq -r '.id')" >> "$GITHUB_OUTPUT"
          echo "KEYCARD_URL=$(echo "$ZONE" | jq -r '.protocols.oauth2.issuer')" >> "$GITHUB_OUTPUT"

      - name: Start server and verify
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        working-directory: ${{ matrix.template }}
        env:
          PORT: "8000"
          KEYCARD_URL: ${{ steps.zone.outputs.KEYCARD_URL }}
          KEYCARD_CLIENT_ID: ${{ secrets.CI_KEYCARD_CLIENT_ID }}
          KEYCARD_CLIENT_SECRET: ${{ secrets.CI_KEYCARD_CLIENT_SECRET }}
        run: bash scripts/ci-verify.sh

      - name: Delete ephemeral zone
        if: always() && github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          CI_KEYCARD_ENDPOINT: ${{ secrets.CI_KEYCARD_ENDPOINT }}
        run: |
          [ -n "${{ steps.zone.outputs.ZONE_ID }}" ] && \
            curl -sf -X DELETE "${CI_KEYCARD_ENDPOINT}/zones/${{ steps.zone.outputs.ZONE_ID }}" \
              -H "Authorization: Bearer $TOKEN" && echo "Zone deleted" || true
