name: Dependency Bump

on:
  workflow_run:
    workflows: ["Template CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: "Dependabot PR number to verify, eval, and merge"
        required: true
        type: string
      attempt:
        description: "Requeue attempt number (1 to 3)"
        required: false
        default: "1"
        type: string

permissions: {}

concurrency:
  group: dependency-bump-${{ github.event_name == 'workflow_dispatch' && format('pr-{0}', inputs.pr) || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  gate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        startsWith(github.event.workflow_run.head_branch, 'dependabot/')
      )
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      pr: ${{ steps.gate.outputs.pr }}
      head_sha: ${{ steps.gate.outputs.head_sha }}
      templates: ${{ steps.gate.outputs.templates }}
      ok: ${{ steps.gate.outputs.ok }}
      reason: ${{ steps.gate.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PR: ${{ inputs.pr }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_RUN_HTML_URL: ${{ github.event.workflow_run.html_url }}
        run: bash .github/scripts/bump-gate.sh

  verify:
    needs: gate
    if: needs.gate.outputs.ok == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      templates: ${{ needs.gate.outputs.templates }}
      ref: ${{ needs.gate.outputs.head_sha }}
    secrets: inherit

  eval:
    needs: [gate, verify]
    if: needs.gate.outputs.ok == 'true' && needs.verify.result == 'success'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/eval.yml
    with:
      templates: ${{ needs.gate.outputs.templates }}
      ref: ${{ needs.gate.outputs.head_sha }}
    secrets: inherit

  result:
    needs: [gate, verify, eval]
    if: ${{ !cancelled() && needs.gate.outputs.pr != '' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      statuses: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Report status and merge when green
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.gate.outputs.pr }}
          HEAD_SHA: ${{ needs.gate.outputs.head_sha }}
          TEMPLATES: ${{ needs.gate.outputs.templates }}
          GATE_OK: ${{ needs.gate.outputs.ok }}
          GATE_REASON: ${{ needs.gate.outputs.reason }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          EVAL_RESULT: ${{ needs.eval.result }}
          ATTEMPT: ${{ inputs.attempt || '1' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CI_WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/ci.yml
        run: bash .github/scripts/bump-result.sh
