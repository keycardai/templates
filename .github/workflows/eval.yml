name: Template Eval
run-name: ${{ github.event.schedule == '0 9 * * *' && 'Nightly Template Eval' || github.workflow }}

on:
  schedule:
    - cron: "0 6 * * 1"  # Mondays at 6 AM UTC
    - cron: "0 9 * * *"  # Nightly SDK release check at 9 AM UTC
  workflow_dispatch:
    inputs:
      template:
        description: "Template to eval (leave blank for all)"
        required: false
  workflow_call:
    inputs:
      templates:
        description: "JSON array of template directory names to eval"
        required: true
        type: string
      ref:
        description: "Commit SHA to check out"
        required: true
        type: string

concurrency:
  group: template-eval-zone
  cancel-in-progress: false
  queue: max

jobs:
  check-release:
    if: github.event.schedule == '0 9 * * *'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      run_eval: ${{ steps.check.outputs.run_eval }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          SDK_TAGS_FILE: ${{ runner.temp }}/sdk-tags.txt
        run: bash eval/nightly-sdk-check.sh
      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.tags_ready == 'true'
        with:
          name: sdk-tags
          path: ${{ runner.temp }}/sdk-tags.txt
          retention-days: 90
          overwrite: true

  discover:
    needs: check-release
    if: ${{ !cancelled() && needs.check-release.outputs.run_eval != 'false' }}
    runs-on: ubuntu-24.04
    outputs:
      templates: ${{ steps.find.outputs.templates }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        env:
          TEMPLATE: ${{ inputs.template }}
          TEMPLATES: ${{ inputs.templates }}
        run: |
          # A workflow_call or named dispatch bypasses eval/eval-skip.txt;
          # only the discovered full matrix is filtered.
          if [ -n "$TEMPLATES" ]; then
            dirs=$(jq -ce 'if type == "array" then . else error("templates must be a JSON array") end' <<< "$TEMPLATES")
            echo "templates=$dirs" >> "$GITHUB_OUTPUT"
          elif [ -n "$TEMPLATE" ]; then
            dirs=$(jq -cn --arg t "$TEMPLATE" '[$t]')
            echo "templates=$dirs" >> "$GITHUB_OUTPUT"
          else
            skip=$(sed -e 's/#.*//' -e 's/[[:space:]]*$//' -e '/^$/d' eval/eval-skip.txt)
            dirs=$(find . -maxdepth 1 -mindepth 1 -type d ! -name '.*' ! -name '_*' ! -name 'scripts' ! -name 'eval' \
              \( -exec test -f '{}/package.json' \; -o -exec test -f '{}/pyproject.toml' \; -o -exec test -f '{}/go.mod' \; -o -exec test -f '{}/Gemfile' \; -o -exec test -f '{}/build.gradle.kts' \; \) -print \
              | sed 's|^\./||' | sort | grep -vxF -f <(echo "$skip") | jq -R . | jq -sc .)
            echo "templates=$dirs" >> "$GITHUB_OUTPUT"
          fi

  preflight:
    needs: check-release
    if: ${{ !cancelled() && needs.check-release.outputs.run_eval != 'false' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "eval/package-lock.json"
      - name: Install eval dependencies
        working-directory: eval
        run: npm ci
      - name: Test eval helpers
        working-directory: eval
        run: npm test
      - name: Check eval zone config
        working-directory: eval
        env:
          CI_KEYCARD_CLIENT_ID: ${{ secrets.EVAL_KEYCARD_CLIENT_ID || secrets.CI_KEYCARD_CLIENT_ID }}
          CI_KEYCARD_CLIENT_SECRET: ${{ secrets.EVAL_KEYCARD_CLIENT_SECRET || secrets.CI_KEYCARD_CLIENT_SECRET }}
          CI_KEYCARD_ENDPOINT: ${{ secrets.CI_KEYCARD_ENDPOINT }}
          EVAL_TEST_USER_EMAIL: ${{ secrets.EVAL_TEST_USER_EMAIL }}
          EVAL_ORG_ID: ${{ secrets.EVAL_ORG_ID }}
          EVAL_ZONE_ID: ${{ secrets.EVAL_ZONE_ID }}
        run: npx tsx preflight.ts

  eval:
    needs: [discover, preflight]
    if: ${{ !cancelled() && needs.discover.result == 'success' && needs.preflight.result == 'success' }}
    # Pinned image: the Playwright locked in eval/package-lock.json has
    # chromium builds only for the Ubuntu releases it knows, so the runner
    # image moves together with that lock.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        template: ${{ fromJson(needs.discover.outputs.templates) }}
    env:
      CI_KEYCARD_CLIENT_ID: ${{ secrets.EVAL_KEYCARD_CLIENT_ID || secrets.CI_KEYCARD_CLIENT_ID }}
      CI_KEYCARD_CLIENT_SECRET: ${{ secrets.EVAL_KEYCARD_CLIENT_SECRET || secrets.CI_KEYCARD_CLIENT_SECRET }}
      CI_KEYCARD_ENDPOINT: ${{ secrets.CI_KEYCARD_ENDPOINT }}
      EVAL_TEST_USER_EMAIL: ${{ secrets.EVAL_TEST_USER_EMAIL }}
      EVAL_TEST_USER_PASSWORD: ${{ secrets.EVAL_TEST_USER_PASSWORD }}
      EVAL_ORG_ID: ${{ secrets.EVAL_ORG_ID }}
      EVAL_ZONE_ID: ${{ secrets.EVAL_ZONE_ID }}
      EVAL_ZONE_ISSUER_URL: ${{ secrets.EVAL_ZONE_ISSUER_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      EVAL_HEADLESS: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Check for Wrangler config
        id: wrangler
        if: ${{ hashFiles(format('{0}/wrangler.jsonc', matrix.template), format('{0}/wrangler.json', matrix.template), format('{0}/wrangler.toml', matrix.template)) != '' }}
        run: echo "present=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ (steps.wrangler.outputs.present == 'true' || matrix.template == 'autonomous-agent-snowflake-wif') && '22' || '20' }}
          cache: "npm"
          cache-dependency-path: "eval/package-lock.json"

      # Available for Go templates: the harness runs `go run .` to start the
      # server and the build agent runs `go build`. No-op for other languages.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      # Available for Python agent templates: the harness boots them with
      # `uv run langgraph dev`. No-op for other languages.
      # The post-job cache prune only trims what gets saved; it must never
      # decide whether an eval passed.
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          prune-cache: false

      # Available for Ruby templates: the harness boots them with
      # `bundle exec rackup` and the build agent runs `bundle install`.
      # Guarded because bundler-cache fails on a directory without a Gemfile.
      - name: Check for Gemfile
        id: gemfile
        run: |
          if [ -f "${{ matrix.template }}/Gemfile" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; fi
      - uses: ruby/setup-ruby@v1
        if: steps.gemfile.outputs.present == 'true'
        with:
          ruby-version: "3.4"
          # The templates ship no Gemfile.lock, so resolution happens here
          # against the CI Ruby rather than whichever Ruby wrote a lockfile.
          bundler-cache: true
          working-directory: ${{ matrix.template }}

      # Available for Java templates: the build agent runs the Gradle wrapper
      # and the harness starts the server from its installDist output. The
      # wrapper download and dependency resolution happen here because each of
      # the agent's shell commands times out after 60 seconds. Guarded like Ruby.
      - name: Check for build.gradle.kts
        id: gradle
        run: |
          if [ -f "${{ matrix.template }}/build.gradle.kts" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-java@v4
        if: steps.gradle.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        if: steps.gradle.outputs.present == 'true'
      - name: Warm the Gradle wrapper and dependencies
        if: steps.gradle.outputs.present == 'true'
        working-directory: ${{ matrix.template }}
        run: ./gradlew -q dependencies --configuration runtimeClasspath > /dev/null

      - name: Install eval dependencies
        working-directory: eval
        run: npm install

      - name: Install cloudflared for Wrangler templates
        if: steps.wrangler.outputs.present == 'true'
        run: |
          curl --fail --silent --show-error --location --retry 3 --max-time 120 \
            https://github.com/cloudflare/cloudflared/releases/download/2025.11.1/cloudflared-linux-amd64 \
            --output "$RUNNER_TEMP/cloudflared"
          echo "991dffd8889ee9f0147b6b48933da9e4407e68ea8c6d984f55fa2d3db4bb431d  $RUNNER_TEMP/cloudflared" | sha256sum --check
          chmod +x "$RUNNER_TEMP/cloudflared"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # Run from eval/ so npx resolves the pinned playwright in eval/node_modules
      # and installs the matching browser build. Running at the repo root pulls a
      # transient playwright whose browser build differs from the one the eval uses.
      - name: Install Playwright browser
        working-directory: eval
        run: npx playwright install chromium --with-deps

      - name: Run eval
        id: run-eval
        working-directory: eval
        env:
          EVAL_BUILD_AGENT_USAGE_FILE: ${{ runner.temp }}/build-agent-usage.json
        run: npx tsx index.ts --template ${{ matrix.template }}

      - name: Upload build agent usage
        if: ${{ !cancelled() && (steps.run-eval.outcome == 'success' || steps.run-eval.outcome == 'failure') }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: build-agent-usage-${{ github.run_attempt }}-${{ matrix.template }}
          path: ${{ runner.temp }}/build-agent-usage.json

  summary:
    name: Summarize build agent usage
    needs: [discover, eval]
    if: ${{ !cancelled() && (needs.eval.result == 'success' || needs.eval.result == 'failure') }}
    continue-on-error: true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: build-agent-usage-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/build-agent-usage
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "eval/package-lock.json"
      - name: Install eval dependencies
        working-directory: eval
        run: npm ci
      - name: Write run usage summary
        working-directory: eval
        env:
          EVAL_TEMPLATES: ${{ needs.discover.outputs.templates }}
          USAGE_DIR: ${{ runner.temp }}/build-agent-usage
        run: npx tsx summarize-build-agent-usage.ts "$USAGE_DIR"

  # Posts a failed scheduled run to Slack. The step skips while the
  # EVAL_SLACK_WEBHOOK_URL secret is unset, so the job stays green without it.
  notify:
    needs: [discover, preflight, eval]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    env:
      EVAL_SLACK_WEBHOOK_URL: ${{ secrets.EVAL_SLACK_WEBHOOK_URL }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Post failure to Slack
        if: env.EVAL_SLACK_WEBHOOK_URL != ''
        run: |
          jq -n --arg text ":red_circle: Weekly Template Eval failed on ${GITHUB_REF_NAME}: ${RUN_URL}" '{text: $text}' \
            | curl -fsS -X POST -H 'Content-Type: application/json' --data @- "$EVAL_SLACK_WEBHOOK_URL"
