name: Template Eval

on:
  schedule:
    - cron: "0 6 * * 1"  # Mondays at 6 AM UTC
  workflow_dispatch:
    inputs:
      template:
        description: "Template to eval (leave blank for all)"
        required: false

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      templates: ${{ steps.find.outputs.templates }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        run: |
          # A named dispatch is operator intent, so it bypasses eval/eval-skip.txt;
          # only the discovered full matrix is filtered.
          if [ -n "${{ inputs.template }}" ]; then
            echo "templates=[\"${{ inputs.template }}\"]" >> "$GITHUB_OUTPUT"
          else
            skip=$(sed -e 's/#.*//' -e 's/[[:space:]]*$//' -e '/^$/d' eval/eval-skip.txt)
            dirs=$(find . -maxdepth 1 -mindepth 1 -type d ! -name '.*' ! -name 'scripts' ! -name 'eval' \
              \( -exec test -f '{}/package.json' \; -o -exec test -f '{}/pyproject.toml' \; -o -exec test -f '{}/go.mod' \; -o -exec test -f '{}/Gemfile' \; \) -print \
              | sed 's|^\./||' | sort | grep -vxF -f <(echo "$skip") | jq -R . | jq -sc .)
            echo "templates=$dirs" >> "$GITHUB_OUTPUT"
          fi

  eval:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # All jobs share one eval zone (EVAL_ZONE_ID) and every template
      # registers the same localhost resource identifier, so parallel jobs
      # collide: 409 on resource create, and one job's cleanup tears down the
      # app another job is mid-OAuth with. Serialize.
      max-parallel: 1
      matrix:
        template: ${{ fromJson(needs.discover.outputs.templates) }}
    env:
      CI_KEYCARD_CLIENT_ID: ${{ secrets.CI_KEYCARD_CLIENT_ID }}
      CI_KEYCARD_CLIENT_SECRET: ${{ secrets.CI_KEYCARD_CLIENT_SECRET }}
      CI_KEYCARD_ENDPOINT: ${{ secrets.CI_KEYCARD_ENDPOINT }}
      EVAL_TEST_USER_EMAIL: ${{ secrets.EVAL_TEST_USER_EMAIL }}
      EVAL_TEST_USER_PASSWORD: ${{ secrets.EVAL_TEST_USER_PASSWORD }}
      EVAL_ZONE_ID: ${{ secrets.EVAL_ZONE_ID }}
      EVAL_ZONE_ISSUER_URL: ${{ secrets.EVAL_ZONE_ISSUER_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      EVAL_HEADLESS: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "eval/package-lock.json"

      # Available for Go templates: the harness runs `go run .` to start the
      # server and the build agent runs `go build`. No-op for other languages.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      # Available for Python agent templates: the harness boots them with
      # `uv run langgraph dev`. No-op for other languages.
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Available for Ruby templates: the harness boots them with
      # `bundle exec rackup` and the build agent runs `bundle install`.
      # Guarded because bundler-cache fails on a directory without a Gemfile.
      - name: Check for Gemfile
        id: gemfile
        run: |
          if [ -f "${{ matrix.template }}/Gemfile" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; fi
      - uses: ruby/setup-ruby@v1
        if: steps.gemfile.outputs.present == 'true'
        with:
          ruby-version: "3.4"
          # The templates ship no Gemfile.lock, so resolution happens here
          # against the CI Ruby rather than whichever Ruby wrote a lockfile.
          bundler-cache: true
          working-directory: ${{ matrix.template }}

      - name: Install eval dependencies
        working-directory: eval
        run: npm install

      # Run from eval/ so npx resolves the pinned playwright in eval/node_modules
      # and installs the matching browser build. Running at the repo root pulls a
      # transient playwright whose browser build differs from the one the eval uses.
      - name: Install Playwright browser
        working-directory: eval
        run: npx playwright install chromium --with-deps

      - name: Run eval
        working-directory: eval
        run: npx tsx index.ts --template ${{ matrix.template }}
