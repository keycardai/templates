# Keeps every template on current Keycard SDK and third-party dependencies.
# Dependabot now handles third-party updates alongside Keycard SDKs (Socket is
# no longer the only third-party path). Each template has its own entry so each
# PR stays scoped to one template and can be verified, evaluated, and merged by
# .github/workflows/dependency-bump.yml.
#
# Per-template groups:
#   - keycard: Keycard SDK version updates.
#   - third-party: minor and patch third-party version updates (majors open as
#     single PRs).
#   - security: security updates, kept separate from version updates so fixes
#     are never held back. Security updates require Dependabot alerts and
#     Dependabot security updates to be enabled in repository settings.
#
# Cooldown applies 30/7/3 days to third-party major/minor/patch version updates
# and excludes Keycard SDK patterns via cooldown.exclude so GitHub's default
# 3-day cooldown does not delay Keycard SDK releases. Cooldown never applies to
# security updates.
#
# mcp-server-ruby has no Gemfile.lock and uses >= floors, so it always resolves
# the latest Keycard SDK and is covered by the nightly eval rather than
# Dependabot.
version: 2
updates:
  - package-ecosystem: npm
    directory: /autonomous-agent-snowflake-wif
    schedule:
      interval: daily
      time: "06:00"
      timezone: Etc/UTC
    groups:
      keycard:
        applies-to: version-updates
        patterns:
          - "@keycardai/*"
      third-party:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          - "@keycardai/*"
        update-types:
          - minor
          - patch
      security:
        applies-to: security-updates
        patterns:
          - "*"
    cooldown:
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
      exclude:
        - "@keycardai/*"
    versioning-strategy: increase
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies

