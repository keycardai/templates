spring.application.name=mcp-server-java-spring-ai
spring.main.banner-mode=off
spring.ai.mcp.server.name=mcp-server-java-spring-ai
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.type=SYNC
server.port=${PORT:8000}
keycard.zone-url=${KEYCARD_URL}
keycard.resource-name=mcp-server-java-spring-ai
keycard.scopes-supported=mcp:tools
